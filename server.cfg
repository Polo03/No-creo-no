#####################################################
#        Servidor Roleplay - ESX Legacy             #
#   Docs de comandos: https://aka.cfx.re/server-commands
#####################################################

## [!] Nombre, descripción, tags, banners e icono del servidor
## se configuran ahora en el Cfx Portal: https://portal.cfx.re/servers
## (sv_projectName, sv_projectDesc, sv_hostname, locale, tags...)

## --- Ajustes básicos (txAdmin rellena los {{...}} al desplegar) ---
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
set mysql_connection_string "{{dbConnectionString}}"
{{serverEndpoints}}

sv_enforceGameBuild 3258
set resources_useSystemChat true

## --- Permisos de framework y administración ---
add_principal group.admin group.user
add_ace group.admin command allow       # todos los comandos
add_ace group.admin command.quit deny   # excepto apagar con quit
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow
{{addPrincipalsMaster}}

## --- pma-voice ---
setr voice_enableRadioAnim 1
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_enableUi 0

## --- Seguridad ---
sv_enableNetworkedSounds false
sv_enableNetworkedScriptEntityStates false
sv_enableNetworkedPhoneExplosions false
sv_filterRequestControl 2

## --- ESX ---
setr esx:locale "es"
#setr esx:identifier "license"

## Whitelist por Discord (opcional; déjalo vacío si no la usas)
set discord:botToken ""
set whitelist:webhook ""

## --- Arranque de recursos (el orden importa) ---
ensure chat
ensure oxmysql
ensure ox_lib
ensure esx_lib

ensure es_extended
ensure [core]
ensure [standalone]
ensure [esx_addons]

## Tus scripts propios: mételos en resources/[custom] del repo
ensure [custom]
